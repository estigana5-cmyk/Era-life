<body class="bg-gray-950 text-white min-h-screen selection:bg-fuchsia-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Native Web Audio Synthesizer for Pure Sound Effects ---
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playWaterSplash() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      playWaterEmpty() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(350, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      playCompleteChime() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.3);
        });
      }
      playSaveSuccess() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }
    const synth = new SoundSynth();

    // Custom SVG Ribbon Component
    const CoquetteRibbon = ({ className = "w-6 h-6 text-fuchsia-400" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 11C10.5 7.5 7 5 4.5 6.5C2 8 2.5 11.5 5 13C7.5 14.5 11 12.5 12 11Z" />
        <path d="M12 11C13.5 7.5 17 5 19.5 6.5C22 8 21.5 11.5 19 13C16.5 14.5 13 12.5 12 11Z" />
        <circle cx="12" cy="11.5" r="2" />
        <path d="M11 13.5C9.5 16.5 7 20 5 21.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
        <path d="M13 13.5C14.5 16.5 17 20 19 21.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
      </svg>
    );

    // Initial Defaults & Constants
    const NOVEMBER_2026_DAYS = 30; // Nov 1 (Sun) to Nov 30 (Mon) 2026
    const DEFAULT_TIMEZONE = "Africa/Tripoli";

    const DEFAULT_HABITS = {
      // 1. Morning Care
      morning_azkar: false,
      morning_teeth: false,
      morning_skinclean: false,
      morning_serum: false,
      morning_sunscreen: false,

      // 2. Daily Habits
      nail_filing: false,
      morning_pills: false, // can be N/A
      morning_pills_na: false,
      henna_sidr_mshat: false,
      e_marketing: false,
      content_creation: false,
      education_homecare: false,

      // 3. Evening Care
      evening_azkar: false,
      evening_pills: false, // N/A option
      evening_pills_na: false,
      evening_teeth: false,
      evening_skinclean: false,
      evening_skin_care: false,
      evening_body_care: false,

      // 4. Study (5 Sessions)
      study_sessions: [
        { id: 1, done: false, type: 'مراجعة' },
        { id: 2, done: false, type: 'حل' },
        { id: 3, done: false, type: 'مشاهدة' },
        { id: 4, done: false, type: 'حل' },
        { id: 5, done: false, type: 'مراجعة' }
      ],

      // 5. Prayers
      prayers: {
        fajr: { done: false, late: false },
        dhuhr: { done: false, late: false },
        asr: { done: false, late: false },
        maghrib: { done: false, late: false },
        isha: { done: false, late: false },
      },

      // 6. Water (mL: max 2000)
      water_ml: 0,

      // 7. Screen Time (Hours)
      screen_hours: "",

      // 8. Weekly/Daily Care
      shaving: false,
      ipl_laser: false,
      ipl_na: false,

      // 9. Sleep (Hours)
      sleep_night: "",
      sleep_nap: "",

      // Workouts
      workouts: [
        { id: 'w1', name: 'تمارين الإطالة والإحماء', url: 'https://www.youtube.com/watch?v=inpok4MKVLM', durationMin: 15, actualMoveMin: 15, notes: 'روتين ممتاز للنشاط' }
      ],

      // Notes
      free_notes: ""
    };

    // Calculate Day Score Metrics
    const calculateDayScore = (data) => {
      let scores = {};
      
      // 1. Morning Care (5 items)
      const mItems = [data.morning_azkar, data.morning_teeth, data.morning_skinclean, data.morning_serum, data.morning_sunscreen];
      scores.morning = (mItems.filter(Boolean).length / 5) * 100;

      // 2. Evening Care (6 items + 1 NA pill check)
      let eItems = [data.evening_azkar, data.evening_teeth, data.evening_skinclean, data.evening_skin_care, data.evening_body_care];
      let eTotal = 5;
      if (!data.evening_pills_na) {
        eTotal += 1;
        if (data.evening_pills) eItems.push(true);
      }
      scores.evening = (eItems.filter(Boolean).length / eTotal) * 100;

      // 3. Daily Growth Habits (6 items total)
      let dItems = [data.nail_filing, data.henna_sidr_mshat, data.e_marketing, data.content_creation, data.education_homecare];
      let dTotal = 5;
      if (!data.morning_pills_na) {
        dTotal += 1;
        if (data.morning_pills) dItems.push(true);
      }
      scores.habits = (dItems.filter(Boolean).length / dTotal) * 100;

      // 4. Study Sessions (5 sessions)
      const sDone = data.study_sessions.filter(s => s.done).length;
      scores.study = (sDone / 5) * 100;

      // 5. Prayers (5 prayers: On time=1, Late=0.5, Unperformed=0)
      let pPoints = 0;
      Object.values(data.prayers).forEach(p => {
        if (p.done) {
          pPoints += p.late ? 0.5 : 1.0;
        }
      });
      scores.prayers = (pPoints / 5.0) * 100;

      // 6. Water (Goal: 2000 ml)
      const wVal = Math.min(2000, Number(data.water_ml) || 0);
      scores.water = (wVal / 2000) * 100;

      // 7. Workouts (Goal: 15 min actual movement)
      const moveMin = data.workouts.reduce((acc, w) => acc + (Number(w.actualMoveMin) || 0), 0);
      scores.workouts = Math.min(100, (moveMin / 15) * 100);

      // 8. Sleep (Goal: 8 hours total)
      const sleepTotal = (Number(data.sleep_night) || 0) + (Number(data.sleep_nap) || 0);
      scores.sleep = data.sleep_night !== "" ? Math.min(100, (sleepTotal / 8) * 100) : 0;

      // 9. Phone Screen Time (Goal: <= 3 hours = 100%, >3h = 3/hours * 100)
      if (data.screen_hours !== "" && !isNaN(Number(data.screen_hours))) {
        const hrs = Number(data.screen_hours);
        if (hrs <= 3) {
          scores.screen = 100;
        } else if (hrs > 0) {
          scores.screen = Math.min(100, (3 / hrs) * 100);
        } else {
          scores.screen = 100;
        }
      } else {
        scores.screen = 0;
      }

      // Overall Score Calculation (Average of 9 Categories)
      const catKeys = ['morning', 'evening', 'habits', 'study', 'prayers', 'water', 'workouts', 'sleep', 'screen'];
      const totalSum = catKeys.reduce((acc, k) => acc + (scores[k] || 0), 0);
      const overallScore = Math.round(totalSum / catKeys.length);

      // Calculate Registration Completion Progress (% of fields interacted with)
      let filledFields = 0;
      let totalFields = 22; // Core fields count
      if (data.morning_azkar) filledFields++;
      if (data.morning_teeth) filledFields++;
      if (data.evening_azkar) filledFields++;
      if (data.evening_teeth) filledFields++;
      if (data.water_ml > 0) filledFields++;
      if (data.screen_hours !== "") filledFields++;
      if (data.sleep_night !== "") filledFields++;
      if (sDone > 0) filledFields += (sDone / 5);
      
      const registrationProgress = Math.min(100, Math.round((filledFields / 12) * 100));

      return { scores, overallScore, registrationProgress };
    };

    // MAIN REACT APP
    function App() {
      // User Auth State
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [isViewerMode, setIsViewerMode] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      const [ownerPassword, setOwnerPassword] = useState(() => localStorage.getItem("era_owner_pass") || "era2026");
      const [authError, setAuthError] = useState("");

      // App Active Tab
      const [activeTab, setActiveTab] = useState("daily"); // daily, harvest, scoring

      // Date Management (Default: Nov 15, 2026 or selected Nov 2026 day)
      const [selectedDay, setSelectedDay] = useState(15);
      const [liveTime, setLiveTime] = useState("");

      // Visitor Count for Viewer Mode (Stored cumulatively)
      const [visitorCount, setVisitorCount] = useState(() => {
        return Number(localStorage.getItem("era_cumulative_visitors") || 142);
      });

      // Days Database (Owner persistence vs Sandbox)
      const [daysData, setDaysData] = useState(() => {
        const saved = localStorage.getItem("era_days_db_nov2026");
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { }
        }
        // Initialize 30 Days of November 2026
        const initDB = {};
        for (let d = 1; d <= NOVEMBER_2026_DAYS; d++) {
          initDB[d] = {
            dayNum: d,
            status: 'empty', // empty, draft, committed
            lastSaved: null,
            revision: 1,
            data: JSON.parse(JSON.stringify(DEFAULT_HABITS))
          };
        }
        return initDB;
      });

      // Sound Mute Toggle
      const [isMuted, setIsMuted] = useState(false);

      // Workout Stopwatch State
      const [timerRunning, setTimerRunning] = useState(false);
      const [timerSeconds, setTimerSeconds] = useState(0);
      const timerRef = useRef(null);

      // Confirmation Modal State
      const [showCommitModal, setShowCommitModal] = useState(false);
      const [showPasswordChangeModal, setShowPasswordChangeModal] = useState(false);
      const [newPass, setNewPass] = useState("");
      const [noticeMessage, setNoticeMessage] = useState("");

      // Live Time Clock (Tripoli Africa/Tripoli - UTC+2)
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          const options = {
            timeZone: DEFAULT_TIMEZONE,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
          };
          setLiveTime(new Intl.DateTimeFormat('en-US', options).format(now));
        };
        updateClock();
        const interval = setInterval(updateClock, 1000);
        return () => clearInterval(interval);
      }, []);

      // Stopwatch logic
      useEffect(() => {
        if (timerRunning) {
          timerRef.current = setInterval(() => {
            setTimerSeconds(prev => prev + 1);
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [timerRunning]);

      // Sound Mute Synchronization
      useEffect(() => {
        synth.muted = isMuted;
      }, [isMuted]);

      // Auto-save notice dismiss
      useEffect(() => {
        if (noticeMessage) {
          const t = setTimeout(() => setNoticeMessage(""), 4000);
          return () => clearTimeout(t);
        }
      }, [noticeMessage]);

      // Login Handler
      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError("");

        if (passwordInput === ownerPassword) {
          setIsAuthenticated(true);
          setIsViewerMode(false);
        } else if (passwordInput === "000") {
          setIsAuthenticated(true);
          setIsViewerMode(true);
          // Increment visitor count cumulatively
          const newCount = visitorCount + 1;
          setVisitorCount(newCount);
          localStorage.setItem("era_cumulative_visitors", newCount.toString());
        } else {
          setAuthError("كلمة المرور غير صحيحة. استخدم رمز 000 لوضع المشاهدة.");
        }
      };

      // Current Selected Day Entry
      const currentDayObject = daysData[selectedDay] || {
        dayNum: selectedDay,
        status: 'empty',
        lastSaved: null,
        revision: 1,
        data: JSON.parse(JSON.stringify(DEFAULT_HABITS))
      };

      // Update current day habit field
      const updateHabitField = (fieldPath, value) => {
        if (isViewerMode) {
          // Sandbox update only in React state
          setDaysData(prev => {
            const copy = JSON.parse(JSON.stringify(prev));
            if (!copy[selectedDay]) return prev;
            setDeepValue(copy[selectedDay].data, fieldPath, value);
            if (copy[selectedDay].status === 'empty') copy[selectedDay].status = 'draft';
            return copy;
          });
          return;
        }

        // Owner Update
        setDaysData(prev => {
          const copy = JSON.parse(JSON.stringify(prev));
          const dayObj = copy[selectedDay];
          setDeepValue(dayObj.data, fieldPath, value);
          if (dayObj.status === 'empty' || dayObj.status === 'committed') {
            dayObj.status = 'draft'; // Editing reverts committed back to draft
          }
          return copy;
        });
      };

      // Helper function to set nested object properties
      const setDeepValue = (obj, path, val) => {
        const parts = path.split('.');
        let current = obj;
        for (let i = 0; i < parts.length - 1; i++) {
          if (!current[parts[i]]) current[parts[i]] = {};
          current = current[parts[i]];
        }
        current[parts[parts.length - 1]] = val;
      };

      // Water Droplet Handler with Audio & Particle Sparkle
      const handleWaterAdd = (amount) => {
        const currentW = Number(currentDayObject.data.water_ml) || 0;
        let nextW = currentW + amount;
        if (nextW > 2000) nextW = 2000;
        updateHabitField('water_ml', nextW);
        synth.playWaterSplash();
      };

      const handleWaterReset = () => {
        updateHabitField('water_ml', 0);
        synth.playWaterEmpty();
      };

      // Save Draft Handler
      const handleSaveDraft = () => {
        if (isViewerMode) {
          setNoticeMessage("⚠️ وضع المشاهدة: لا يتم حفظ التغيرات بشكل دائم.");
          return;
        }

        const nowStr = new Date().toLocaleTimeString('ar-LY', { hour: '2-digit', minute: '2-digit' });
        setDaysData(prev => {
          const copy = JSON.parse(JSON.stringify(prev));
          const dayObj = copy[selectedDay];
          dayObj.status = 'draft';
          dayObj.lastSaved = nowStr;
          dayObj.revision += 1;
          localStorage.setItem("era_days_db_nov2026", JSON.stringify(copy));
          return copy;
        });

        synth.playSaveSuccess();
        setNoticeMessage(`✨ تم حفظ المسودة ليوم ${selectedDay} نوفمبر بنجاح!`);
      };

      // Commit & Finalize Day Handler
      const handleConfirmCommit = () => {
        if (isViewerMode) {
          setNoticeMessage("⚠️ وضع المشاهدة: لا يمكنك اعتماد اليوم بالسجل الأصلي.");
          setShowCommitModal(false);
          return;
        }

        const nowStr = new Date().toLocaleTimeString('ar-LY', { hour: '2-digit', minute: '2-digit' });
        setDaysData(prev => {
          const copy = JSON.parse(JSON.stringify(prev));
          const dayObj = copy[selectedDay];
          dayObj.status = 'committed';
          dayObj.lastSaved = nowStr;
          dayObj.revision += 1;
          localStorage.setItem("era_days_db_nov2026", JSON.stringify(copy));
          return copy;
        });

        synth.playCompleteChime();
        setShowCommitModal(false);
        setNoticeMessage(`🎉 تم اعتماد وتوثيق يوم ${selectedDay} نوفمبر في حصاد الشهر!`);
      };

      // Password Change Handler
      const handleSaveNewPassword = (e) => {
        e.preventDefault();
        if (!newPass || newPass.length < 4) {
          alert("كلمة المرور يجب أن تكون 4 أحرف أو أرقام على الأقل");
          return;
        }
        setOwnerPassword(newPass);
        localStorage.setItem("era_owner_pass", newPass);
        setShowPasswordChangeModal(false);
        setNoticeMessage("🔒 تم تغيير كلمة مرور المالك بنجاح!");
      };

      // Export Data (JSON & CSV)
      const exportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(daysData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Era_Planner_Harvest_Nov2026.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const exportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "اليوم,الحالة,النسبة المئوية %,ساعات المذاكرة,ساعات النوم,استخدام الهاتف,الماء (مل),تاريخ الحفظ\n";

        Object.values(daysData).forEach(day => {
          const { overallScore } = calculateDayScore(day.data);
          const studyHrs = (day.data.study_sessions.filter(s => s.done).length * 30) / 60;
          const sleepTotal = (Number(day.data.sleep_night) || 0) + (Number(day.data.sleep_nap) || 0);
          csvContent += `${day.dayNum},${day.status},${overallScore}%,${studyHrs},${sleepTotal},${day.data.screen_hours || 0},${day.data.water_ml || 0},${day.lastSaved || 'غير مسجل'}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Era_Planner_Summary_Nov2026.csv");
        document.body.appendChild(link);
        link.click();
        link.remove();
      };

      // Calculate Day Score for active display
      const currentScores = useMemo(() => {
        return calculateDayScore(currentDayObject.data);
      }, [currentDayObject]);

      // Calculate Monthly Statistics for Harvest Tab
      const harvestStats = useMemo(() => {
        const allDays = Object.values(daysData);
        const committedDays = allDays.filter(d => d.status === 'committed');

          studyMinTotal += sDone * 30;

          const moveMin = day.data.workouts.reduce((acc, w) => acc + (Number(w.actualMoveMin) || 0), 0);
          workoutMinTotal += moveMin;

          waterMlTotal += Number(day.data.water_ml) || 0;
          sleepTotalSum += (Number(day.data.sleep_night) || 0) + (Number(day.data.sleep_nap) || 0);
          screenTotalSum += Number(day.data.screen_hours) || 0;
        });

        const avgSleep = committedDays.length > 0 ? (sleepTotalSum / committedDays.length).toFixed(1) : 0;
        const avgScreen = committedDays.length > 0 ? (screenTotalSum / committedDays.length).toFixed(1) : 0;

        return {

          draftCount: draftDays.length,
          avgScore,
          totalStudyHours: (studyMinTotal / 60).toFixed(1),
          totalWorkoutMin: workoutMinTotal,

              <div className="bg-gray-900/90 border border-fuchsia-500/30 rounded-3xl p-6 shadow-xl space-y-6">
                <div>
                  <h2 className="text-2xl font-extrabold text-fuchsia-200 flex items-center gap-2">
                    <i data-lucide="info" className="w-6 h-6 text-fuchsia-400"></i>
                    كيف تُحسب نسبة الإنجاز اليومي؟
                  </h2>
                  <p className="text-xs text-gray-400 mt-1 leading-relaxed">
                    تعتمد الخوارزمية على تسعة مجالات متساوية الوزن (100% لكل مجال). تُحسب النسبة الإجمالية كمتوسط موزون لهذه المجالات.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {[
                    { title: '1. العناية الصباحية والمسائية', desc: 'تُحسب بنسبة عدد المهام التي تم تعليمها ÷ إجمالي بنود العناية المنطبقة.' },
                    { title: '2. العادات وتطوير الذات', desc: 'تتضمن برد الأظافر، الحنة والسدر، التسويق، صناعة المحتوى، والاهتمام بالمنزل.' },
                    { title: '3. مذاكرة القدرات والتعليم', desc: '5 جلسات مستهدفة (30 دقيقة للجلسة). النسبة = الجلسات المكتملة ÷ 5.' },
                    { title: '4. متابعة الصلوات الخمس', desc: 'في وقتها = 1 نقطة، متأخرة = 0.5 نقطة. النسبة = مجموع النقاط ÷ 5.' },
                    { title: '5. شرب الماء', desc: 'الهدف 2000 مل (2 لتر). النسبة = الكمية الفعلية ÷ 2000.' },
                    { title: '6. التمارين الرياضية', desc: 'الهدف 15 دقيقة حركة فعلية. النسبة = دقائق الحركة ÷ 15.' },
                    { title: '7. تتبع النوم', desc: 'الهدف 8 ساعات إجمالية (نوم الليل + القيلولة). النسبة = الإجمالي ÷ 8.' },
                    { title: '8. استخدام الهاتف', desc: 'الهدف 3 ساعات أو أقل (100%). في حال الزيادة = (3 ÷ الساعات الفعلية) × 100%.' },
                    { title: '9. استبعاد "لا ينطبق"', desc: 'البنود المستبعدة لا تنقص النقاط بل يعاد توزيع الوزن تلقائياً على باقي المجالات.' },
                  ].map((rule, idx) => (
                    <div key={idx} className="bg-gray-950 p-4 rounded-2xl border border-gray-800 space-y-1">
                      <h4 className="font-bold text-sm text-fuchsia-300">{rule.title}</h4>
                      <p className="text-xs text-gray-400 leading-relaxed">{rule.desc}</p>
                    </div>
                  ))}
                </div>

                <div className="p-4 bg-fuchsia-950/40 border border-fuchsia-500/30 rounded-2xl text-xs text-fuchsia-200 leading-relaxed">
                  💡 <span className="font-bold">تنويه هام:</span> هذه النسب والمؤشرات هي أدوات تنظيمية ومتابعة شخصية لمساعدتك على التطوير، وليست تقييماً لقيمة الشخص أو حكمًا على العبادات.
                </div>
              </div>
            )}

          </main>

          {/* VIEWER CUMULATIVE COUNTER WIDGET (Bottom-Left) */}
          {isViewerMode && (
            <div className="fixed bottom-4 left-4 z-40 bg-gray-900/95 border border-fuchsia-500/40 p-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-3 text-xs max-w-[240px]">
              <div className="p-2 bg-fuchsia-950 rounded-xl text-fuchsia-400">
                <i data-lucide="users" className="w-4 h-4"></i>
              </div>
              <div>
                <span className="block text-[10px] text-gray-400">عداد المتصفحات للمشاهدة:</span>
                <span className="font-bold font-mono text-fuchsia-300 text-sm">{visitorCount} تجربة</span>
              </div>
            </div>
          )}

          {/* COMMIT CONFIRMATION MODAL */}
          {showCommitModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-gray-900 border-2 border-fuchsia-500/40 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <div className="flex items-center gap-3 text-fuchsia-300">
                  <i data-lucide="alert-circle" className="w-6 h-6 text-fuchsia-400"></i>
                  <h3 className="font-bold text-lg">تأكيد اعتماد سجل اليوم</h3>
                </div>

                <p className="text-xs text-gray-300 leading-relaxed">
                  هل أنت متأكدة من اعتماد سجل يوم <span className="font-bold text-fuchsia-300">{selectedDay} نوفمبر</span>؟ 
                  سيتم توثيق هذا اليوم في حصاد الشهر، ويمكنك التعديل عليه لاحقاً إذا لزم الأمر.
                </p>

                <div className="flex items-center justify-end gap-3 pt-3 border-t border-gray-800">
                  <button
                    onClick={() => setShowCommitModal(false)}
                    className="px-4 py-2 bg-gray-950 hover:bg-gray-800 text-gray-300 rounded-xl text-xs font-bold transition"
                  >
                    إلغاء
                  </button>
                  <button
                    onClick={handleConfirmCommit}
                    className="px-5 py-2 bg-fuchsia-600 hover:bg-fuchsia-500 text-white rounded-xl text-xs font-bold transition shadow"
                  >
                    نعم، اعتمد اليوم
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PASSWORD CHANGE MODAL */}
          {showPasswordChangeModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-gray-900 border-2 border-fuchsia-500/40 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
                <div className="flex items-center justify-between text-fuchsia-300">
                  <h3 className="font-bold text-lg flex items-center gap-2">
                    <i data-lucide="key" className="w-5 h-5"></i>
                    تغيير كلمة مرور المالك
                  </h3>
                  <button onClick={() => setShowPasswordChangeModal(false)} className="text-gray-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveNewPassword} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-300 mb-1">كلمة المرور الجديدة:</label>
                    <input
                      type="password"
                      value={newPass}
                      onChange={(e) => setNewPass(e.target.value)}
                      placeholder="أدخل كلمة مرور جديدة..."
                      className="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-2xl text-white text-sm focus:border-fuchsia-400 focus:outline-none"
                      required
                    />
                  </div>

                  <div className="flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowPasswordChangeModal(false)}
                      className="px-4 py-2 bg-gray-950 text-gray-300 rounded-xl text-xs font-bold"
                    >
                      إلغاء
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-fuchsia-600 hover:bg-fuchsia-500 text-white rounded-xl text-xs font-bold shadow"
                    >
                      حفظ كلمة المرور
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Initialize Lucide Icons after render
    setTimeout(() => {
      if (window.lucide) window.lucide.createIcons();
    }, 500);
  </script>
</body>
</html>
